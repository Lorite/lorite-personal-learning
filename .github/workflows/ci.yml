name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build_test_and_format:
    # virtual environments: https://github.com/actions/virtual-environments
    runs-on: ubuntu-22.04
    permissions:
      contents: write # the auto-commit step pushes formatting and regenerated lock files to the pull request branch
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      # Caches and restores the bazelisk download directory, the bazel build directory.
      - name: Cache bazel
        uses: actions/cache@v6.1.0
        env:
          cache-name: bazel-cache
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel
          key: ${{ runner.os }}-${{ env.cache-name }}
      # Checks-out your repository under $GITHUB_WORKSPACE, which is the CWD for
      # the rest of the steps
      - uses: actions/checkout@v7.0.1
        # The auto-commit step pushes with this token. A push with the default GITHUB_TOKEN starts no normal CI
        # run (GitHub holds it as "action_required"), so the required check never ran on the bot's commit and
        # the pull request stayed blocked (Renovate's #252 on 2026-10-14). The PAT push starts CI again.
        with:
          token: ${{ secrets.CODE_FORMATTER_BOT_CONTENTS_TOKEN }}
      # format
      - name: Test if the files are correctly formatted
        id: testFormat
        if: github.actor != 'code-formatter-bot[bot]'
        run: bazel test //tools/format/...
        continue-on-error: true
      - name: Apply formatting if the test fails
        id: applyFormat
        if: always() && steps.testFormat.outcome == 'failure'
        run: bazel run //tools/format:format
      - name: Test if the files are correctly formatted after applying the formatting
        id: testFormatAfterApply
        if: always() && steps.testFormat.outcome == 'failure' && steps.applyFormat.outcome == 'success'
        run: bazel test //tools/format/...
      # Python lock files (pip-compile outputs of rules_python's compile_pip_requirements)
      - name: Test if the Python lock files are up to date
        id: testLocks
        run: bazel test $(bazel query 'attr(name, "^requirements_test$", //...)' | tr '\n' ' ')
        continue-on-error: true
      - name: Recompile the Python lock files if the test fails
        id: updateLocks
        if: always() && steps.testLocks.outcome == 'failure'
        run: |
          for target in $(bazel query 'attr(name, "^requirements[.]update$", //...)'); do
            bazel run "$target"
          done
      # build
      - name: Build the code
        run: bazel build //...
      # test
      - name: Test the code
        run: bazel test //... -- -//tools/... # Exclude tools from testing
      - name: Run the linters # every lint aspect, fails on any finding (fail_on_violation in .bazelrc)
        run: tools/lint/scripts/aspect_lint.sh //...
      - name: Commit the formatting and lock file changes # always try, because bazel build can also modify files
        if: always() && github.event_name == 'pull_request' # main only accepts pull requests (ruleset), so there is nothing to push on a main build
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "Apply formatting and regenerated lock files from CI"
          commit_user_name: code-formatter-bot[bot]
          commit_user_email: code-formatter-bot[bot]@users.noreply.github.com
          commit_author: code-formatter-bot[bot] <code-formatter-bot[bot]@users.noreply.github.com>
