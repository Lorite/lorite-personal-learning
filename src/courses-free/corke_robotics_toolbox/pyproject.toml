[project]
name = "corke-robotics-toolbox-course"
version = "0.1.0"
description = "Hands-on notebooks for Peter Corke's Robotics Toolbox for Python (kinematics, Jacobians, resolved-rate motion control)."
requires-python = "==3.13.*"
dependencies = [
    "roboticstoolbox-python",
    "spatialmath-python",
    "numpy",
    "matplotlib",
    "jupyterlab",
    "nbconvert",
    "ipykernel",
]

[tool.uv]
package = false
